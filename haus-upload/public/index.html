<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110E" />

    <!-- 分页 / 书签上的小图标（档案在 public/ 里，想换图就换掉那几个档案） -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/icon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icon-16.png" />
    <!-- 存到 iPhone 主画面时用的图标 -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- 这段是 Google 搜寻结果 / 分享连结时显示的描述，可以改 -->
    <meta
      name="description"
      content="Haus on 15 is the last freehold residence in SS15 Subang Jaya. Jointly developed by Gamuda Land & Taylor’s Assets, it is within walking distance of SS15 LRT and INTI College."
    />

    <!-- 浏览器分页上显示的标题，可以改 -->
    <title>Gamuda Land SS15 Residence | Pre Launching from RM6xxK</title>

    <!-- 分享连结（WhatsApp / FB / IG）时显示的卡片。改标题记得连下面 og:title 一起改 -->
    <meta property="og:site_name" content="Haus On 15" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hausonss15.com/" />
    <meta property="og:title" content="Gamuda Land SS15 Residence | Pre Launching from RM6xxK" />
    <meta
      property="og:description"
      content="Haus on 15 is the last freehold residence in SS15 Subang Jaya. Jointly developed by Gamuda Land & Taylor’s Assets, it is within walking distance of SS15 LRT and INTI College."
    />
    <meta property="og:image" content="https://hausonss15.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gamuda Land SS15 Residence | Pre Launching from RM6xxK" />
    <meta
      name="twitter:description"
      content="Haus on 15 is the last freehold residence in SS15 Subang Jaya. Jointly developed by Gamuda Land & Taylor’s Assets, it is within walking distance of SS15 LRT and INTI College."
    />
    <meta name="twitter:image" content="https://hausonss15.com/og-image.jpg" />

    <!-- 告诉 Google 这个网站的正式网址（避免 www / 非 www 被当成两个网站） -->
    <link rel="canonical" href="https://hausonss15.com/" />

    <!-- 给 Google 看的结构化资料：这是什么项目、在哪里、怎么联络。
         改价格 / 单位数 / 联络方式的话，这里也要跟着改。 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ApartmentComplex",
        "name": "Haus On 15",
        "url": "https://hausonss15.com/",
        "image": "https://hausonss15.com/og-image.jpg",
        "description": "Haus on 15 is the last freehold residence in SS15 Subang Jaya. Jointly developed by Gamuda Land & Taylor’s Assets, it is within walking distance of SS15 LRT and INTI College.",
        "numberOfAccommodationUnits": 522,
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "SS15",
          "addressLocality": "Subang Jaya",
          "addressRegion": "Selangor",
          "addressCountry": "MY"
        },
        "telephone": "+60179436799",
        "email": "hauson15residence@gmail.com"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- 整个网站都会被塞进下面这个 div。不要删。 -->
    <div id="root"></div>
  </body>
</html>
