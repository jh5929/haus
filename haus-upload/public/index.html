<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110E" />

    <!-- 分页 / 书签上的小图标（档案在 public/ 里，想换图就换掉那几个档案） -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icon-16.png" />
    <!-- 存到 iPhone 主画面时用的图标 -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- 这段是 Google 搜寻结果 / 分享连结时显示的描述，可以改 -->
    <meta
      name="description"
      content="HAUS on 15 — SS15 Subang Jaya's final freehold serviced apartments. Yields up to 9%. Enquire via WhatsApp."
    />

    <!-- 浏览器分页上显示的标题，可以改 -->
    <title>Haus On 15 @ SS15 | Exclusive New Launch Residence</title>

    <!-- 分享连结（WhatsApp / FB / IG）时显示的卡片。改标题记得连下面 og:title 一起改 -->
    <meta property="og:site_name" content="Haus On 15" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hausonss15.com/" />
    <meta property="og:title" content="Haus On 15 @ SS15 | Exclusive New Launch Residence" />
    <meta
      property="og:description"
      content="SS15 Subang Jaya's final freehold serviced apartments by Gamuda Land. From RM663K · yields up to 9%. Enquire via WhatsApp."
    />
    <meta property="og:image" content="https://hausonss15.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Haus On 15 @ SS15 | Exclusive New Launch Residence" />
    <meta
      name="twitter:description"
      content="SS15 Subang Jaya's final freehold serviced apartments by Gamuda Land. From RM663K · yields up to 9%."
    />
    <meta name="twitter:image" content="https://hausonss15.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- 整个网站都会被塞进下面这个 div。不要删。 -->
    <div id="root"></div>
  </body>
</html>
